name: Check iPhone stock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check apple.ae
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ONCE: "1"
        run: python iphone_stock_alert.py
        
